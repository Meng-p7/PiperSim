controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: false

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    piper_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    piper_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Controller parameters nested under controller_manager
    piper_arm_controller.joints: [joint1, joint2, joint3, joint4, joint5, joint6]
    piper_arm_controller.command_interfaces: [position]
    piper_arm_controller.state_interfaces: [position]
    piper_arm_controller.state_publish_rate: 50.0
    piper_arm_controller.action_monitor_rate: 20.0
    piper_arm_controller.allow_partial_joints_goal: false
    piper_arm_controller.constraints.stopped_velocity_tolerance: 0.01
    piper_arm_controller.constraints.goal_time: 0.0

    piper_gripper_controller.joints: [joint7]
    piper_gripper_controller.command_interfaces: [position]
    piper_gripper_controller.state_interfaces: [position]
    piper_gripper_controller.state_publish_rate: 50.0
    piper_gripper_controller.action_monitor_rate: 20.0
    piper_gripper_controller.allow_partial_joints_goal: false
    piper_gripper_controller.constraints.stopped_velocity_tolerance: 0.01
    piper_gripper_controller.constraints.goal_time: 0.0

joint_state_broadcaster:
  ros__parameters: {}

piper_arm_controller:
  ros__parameters:
    joints: [joint1, joint2, joint3, joint4, joint5, joint6]
    command_interfaces: [position]
    state_interfaces: [position]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0

piper_gripper_controller:
  ros__parameters:
    joints: [joint7]
    command_interfaces: [position]
    state_interfaces: [position]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
