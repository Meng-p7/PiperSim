/piper_calibration:
  ros__parameters:
    eye_mode: "eye_in_hand"
    method: "park"
    num_poses: 20

    move_group_name: "piper_arm"
    end_effector_link: "link6"
    base_frame: "base_link"

    camera_topic: "/camera/camera/color/image_raw"
    camera_info_topic: "/camera/camera/color/camera_info"
    camera_frame: "wrist_cam_link"

    board_type: "charuco"
    charuco_rows: 9
    charuco_cols: 14
    charuco_square_length: 0.02
    charuco_marker_length: 0.015
    aruco_dict: "DICT_5X5_100"

    output_frame: "camera_optical_frame"
    result_file: "data/real_eye_in_hand_result.yaml"

    seed_joints: [0.0, 1.57, -1.3485, 0.0, 0.0, 0.0]
    noise_per_joint: [0.05, 0.08, 0.08, 0.10, 0.05, 0.10]

    real_robot: true
