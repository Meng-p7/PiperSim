/piper_calibration:
  ros__parameters:
    method: "park"
    num_poses: 20

    # The URDF frame is tool_0; link6/link6 do not exist.
    base_frame: "base_link"
    end_effector_link: "tool_0"

    # Fixed external camera. Start the corresponding camera ROS2 driver first.
    camera_topic: "/camera/color/image_raw"
    camera_info_topic: "/camera/color/camera_info"
    # Empty means: use CameraInfo.header.frame_id (normally camera_color_optical_frame).
    # Set a non-empty value only to enforce an expected optical frame name.
    camera_frame: ""

    # AprilTag rigidly attached to the robot end effector.
    board_type: "aruco"
    aruco_dict: "DICT_APRILTAG_36H11"
    aruco_marker_length: 0.057
    aruco_marker_id: 0

    # Optional detector parameters for other supported board types.
    charuco_rows: 9
    charuco_cols: 14
    charuco_square_length: 0.02
    charuco_marker_length: 0.015
    chessboard_rows: 10
    chessboard_cols: 12

    result_file: "data/real_eye_to_hand_result.yaml"
    image_save_dir: "data/calibration_images_eye_to_hand"

    # Abort instead of sampling frozen robot/camera data.
    joint_state_timeout_sec: 1.0
    image_timeout_sec: 1.0
    safety_recheck_period_sec: 1.0
