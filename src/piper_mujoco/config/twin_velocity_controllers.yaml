# 数字孪生模式控制器配置（速度控制）
# 用于 MuJoCo -> Real 的安全同步

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    # 状态发布器
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # 速度控制器（替代位置控制器）
    joint_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    # 夹爪速度控制器
    gripper_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true
    publish_rate: 100.0

joint_velocity_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity

gripper_velocity_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - gripper_joint
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity