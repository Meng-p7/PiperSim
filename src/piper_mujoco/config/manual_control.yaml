# 手动控制配置 - 只启动 joint_state_broadcaster，不启动其他控制器
# 允许在 MuJoCo GUI 中手动拖动滑块

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    # 只启动状态发布器
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # 不启动以下控制器，允许手动控制
    # joint_trajectory_controller:
    #   type: joint_trajectory_controller/JointTrajectoryController
    # gripper_controller:
    #   type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true
    publish_rate: 100.0