# PiperSim Docker Compose配置
# 用法: docker compose up -d

services:
  pipersim:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: pipersim:jazzy
    container_name: pipersim

    # 图形界面支持
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ..:/workspace:rw

    # NVIDIA GPU支持
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    # CAN设备支持（真机控制需要）
    privileged: true
    devices:
      - /dev:/dev
    
    # 网络配置
    network_mode: host
    
    # 工作目录
    working_dir: /workspace
    
    # 保持容器运行
    stdin_open: true
    tty: true