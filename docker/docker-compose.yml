name: pipersim

services:
  pipersim:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIPERSIM_UID: ${PIPERSIM_UID:-1000}
        PIPERSIM_GID: ${PIPERSIM_GID:-1000}
    image: pipersim:jazzy

    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    volumes:
      - type: bind
        source: ..
        target: /workspace
      # Never mix host Humble artifacts with container Jazzy artifacts.
      - type: volume
        source: pipersim_build
        target: /workspace/build
      - type: volume
        source: pipersim_install
        target: /workspace/install
      - type: volume
        source: pipersim_log
        target: /workspace/log

    shm_size: 1gb
    working_dir: /workspace
    init: true
    stdin_open: true
    tty: true

volumes:
  pipersim_build:
  pipersim_install:
  pipersim_log:
